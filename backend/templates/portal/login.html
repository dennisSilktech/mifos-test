{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — {{ tenant.tenant_code|default:"Banking SaaS" }}</title>
  
  <!-- Inline SVG Favicon to eliminate 404 errors without inline script/style -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏦</text></svg>">
  
  <!-- External CSS satisfying CSP default-src 'self' -->
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

  <div class="card">
    <div class="logo-icon">🏦</div>
    <h1>Sign in</h1>
    <p class="sub">to <strong>{{ tenant.tenant_code|default:"your banking portal" }}</strong></p>

    {% if form.non_field_errors %}
      <div class="alert">⚠ {{ form.non_field_errors|join:" " }}</div>
    {% endif %}

    <form method="post" action="{% url 'portal:portal-login' %}">
      {% csrf_token %}
      <div class="field">
        <label for="id_username">Email</label>
        <input type="email" name="username" id="id_username" value="{{ form.username.value|default:'' }}" required autofocus>
      </div>

      <div class="field">
        <label for="id_password">Password</label>
        <div class="input-wrap">
          <input type="password" name="password" id="id_password" required>
          <button type="button" class="toggle-pw" id="toggle-pw">Show</button>
        </div>
      </div>

      <button class="btn" type="submit">Sign in</button>
    </form>
  </div>

  <!-- External JS satisfying CSP default-src 'self' -->
  <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
