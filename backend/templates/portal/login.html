<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — {{ tenant.tenant_code|default:"Banking SaaS" }}</title>
  <style>
    :root { --brand: #1b4332; --brand-light: #40916c; --border: #dfe5e2; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f6f8f7; color: #1a1a1a;
    }
    .card {
      background: white; border: 1px solid var(--border); border-radius: 10px;
      padding: 32px; width: 100%; max-width: 380px;
    }
    h1 { font-size: 1.4rem; margin: 0 0 24px; color: var(--brand); }
    label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 0.88rem; }
    input {
      width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem;
    }
    .btn {
      display: block; width: 100%; background: var(--brand-light); color: white; padding: 11px;
      border-radius: 6px; border: none; font-weight: 600; font-size: 0.95rem; cursor: pointer; margin-top: 22px;
    }
    .btn:hover { background: var(--brand); }
    .alert { background: #f8d7da; color: #842029; padding: 12px; border-radius: 6px; font-size: 0.88rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in{% if tenant %} — {{ tenant.tenant_code }}{% endif %}</h1>
    {% if form.non_field_errors %}
      <div class="alert">{{ form.non_field_errors|join:" " }}</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <label for="id_username">Email</label>
      <input type="email" name="username" id="id_username" required autofocus>
      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" required>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
