<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Banking SaaS Admin{% endblock %}</title>
  <style>
    :root { --brand: #1b4332; --brand-light: #40916c; --bg: #f6f8f7; --border: #dfe5e2; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           margin: 0; background: var(--bg); color: #1a1a1a; }
    header { background: var(--brand); color: white; padding: 14px 24px; display: flex;
             align-items: center; justify-content: space-between; }
    header a { color: white; text-decoration: none; font-weight: 600; }
    header nav a { margin-left: 18px; font-weight: 400; opacity: 0.9; }
    main { max-width: 900px; margin: 32px auto; padding: 0 20px; }
    .card { background: white; border: 1px solid var(--border); border-radius: 10px;
            padding: 24px; margin-bottom: 20px; }
    h1 { font-size: 1.4rem; margin-top: 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
    th { color: #555; font-weight: 600; }
    .btn { display: inline-block; background: var(--brand-light); color: white; padding: 9px 16px;
           border-radius: 6px; text-decoration: none; border: none; cursor: pointer; font-size: 0.9rem; }
    .btn:hover { background: var(--brand); }
    .btn-secondary { background: #eee; color: #333; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 0.88rem; }
    input, select { width: 100%; padding: 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.92rem; }
    .status { padding: 3px 9px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; }
    .status-READY { background: #d8f3dc; color: #1b4332; }
    .status-PENDING, .status-PROVISIONING, .status-INITIALIZING { background: #fff3cd; color: #7a5b00; }
    .status-FAILED { background: #f8d7da; color: #842029; }
    .status-SUSPENDED { background: #e2e3e5; color: #41464b; }
    .alert { padding: 14px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem; }
    .alert-success { background: #d8f3dc; color: #1b4332; }
    .alert-error { background: #f8d7da; color: #842029; }
    .credential-box { background: #fffbe6; border: 1px dashed #e0c200; border-radius: 8px;
                       padding: 16px; font-family: monospace; font-size: 0.92rem; }
    .credential-box p { margin: 6px 0; }
    .muted { color: #777; font-size: 0.85rem; }
    .errorlist { color: #b3261e; font-size: 0.85rem; list-style: none; padding: 0; margin: 4px 0 0; }
  </style>
</head>
<body>
  <header>
    <a href="{% url 'dashboard:tenant-list' %}">Banking SaaS Admin</a>
    {% if user.is_authenticated %}
    <nav>
      <a href="{% url 'dashboard:tenant-list' %}">Organizations</a>
      <a href="{% url 'dashboard:create-organization' %}">+ Create Subdomain</a>
      <a href="{% url 'dashboard:logout' %}">Logout ({{ user.email }})</a>
    </nav>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
