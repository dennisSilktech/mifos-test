version: "3.9"

# -----------------------------------------------------------------------
# What's containerized here: Django (web, celery-worker, celery-beat) and
# Redis.
#
# What's NOT here:
#   - PostgreSQL: runs natively on the Ubuntu host (see scripts/setup_
#     postgres.sh) so `psql` and every tenant database it creates are
#     directly visible on the host — nothing hidden inside a container
#     volume. Reached via host.docker.internal.
#   - Fineract: assumed already running as its own standalone container
#     (`docker run --name fineract-server ...`, port 8443 published on the
#     host) — not managed by this compose file. Reached the same way, via
#     host.docker.internal:8443.
#
# host.docker.internal ONLY resolves to your host's IP — it does not make
# host Postgres reachable by itself. You must also:
#   1. Set `listen_addresses = '*'` in postgresql.conf
#   2. Allow the Docker bridge subnet in pg_hba.conf
#   3. Allow port 5432 through ufw/iptables if a firewall is active
# See README.md.
# -----------------------------------------------------------------------

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: tenant_manager.settings.development
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_DEBUG: "true"
  DJANGO_ALLOWED_HOSTS: "*"
  # ... rest of your env vars

  REGISTRY_DB_NAME: ${REGISTRY_DB_NAME:-tenant_registry}
  REGISTRY_DB_USER: ${REGISTRY_DB_USER:-registry_app_role}
  REGISTRY_DB_PASSWORD: ${REGISTRY_DB_PASSWORD}
  REGISTRY_DB_HOST: host.docker.internal
  REGISTRY_DB_PORT: "5432"

  PG_SUPERUSER_HOST: host.docker.internal
  PG_SUPERUSER_PORT: "5432"
  PG_SUPERUSER_NAME: ${PG_SUPERUSER_NAME:-postgres}
  PG_SUPERUSER_PASSWORD: ${PG_SUPERUSER_PASSWORD}

  # Redis is containerized (service name 'redis' on the compose network) —
  # not the host.
  REDIS_URL: redis://redis:6379/0

  CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
  JWT_VERIFYING_KEY: ${JWT_VERIFYING_KEY}

  PLATFORM_BASE_DOMAIN: ${PLATFORM_BASE_DOMAIN:-localhost}

  # Existing standalone Fineract container, published on the host at 8443.
  FINERACT_BASE_URL: ${FINERACT_BASE_URL:-https://host.docker.internal:8443/fineract-provider/api/v1}
  FINERACT_ADMIN_USERNAME: ${FINERACT_ADMIN_USERNAME:-mifos}
  FINERACT_ADMIN_PASSWORD: ${FINERACT_ADMIN_PASSWORD}
  FINERACT_VERIFY_SSL: "false"

services:
  redis:
    image: redis:7-alpine
    container_name: banking-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot readiness gate: waits for the host Postgres to actually accept
  # connections before anything that needs it starts. Exits 0 once ready.
  postgres-check:
    image: postgres:16-alpine
    container_name: banking-postgres-check
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c '
        echo "Waiting for host PostgreSQL..." ;
        until pg_isready -h host.docker.internal -p 5432 -U ${PG_SUPERUSER_NAME:-postgres} -t 3; do sleep 2; done ;
        echo "Host PostgreSQL is reachable."
      '

  # Added Fineract container
  fineract:
    image: apache/fineract:latest
    container_name: banking-fineract
    ports:
      - "8443:8443"
    env_file:
      - fineract/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-check:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: banking-django-web
    ports:
      - "8000:8000"
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-check:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: banking-celery-worker
    command: celery -A tenant_manager worker --loglevel=INFO --concurrency=4
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: banking-celery-beat
    command: celery -A tenant_manager beat --loglevel=INFO
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
