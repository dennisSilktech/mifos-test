version: "3.9"

# -----------------------------------------------------------------------
# What's containerized here: Django (web, celery-worker, celery-beat),
# Fineract, and Redis.
#
# What's NOT here:
#   - PostgreSQL: runs natively on the Ubuntu host so `psql` and every tenant
#     database it creates are directly visible on the host. Reached via 
#     host.docker.internal (or static gateway 172.25.0.1).
# -----------------------------------------------------------------------

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: tenant_manager.settings.development
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_DEBUG: "true"
  DJANGO_ALLOWED_HOSTS: "*"

  REGISTRY_DB_NAME: ${REGISTRY_DB_NAME:-tenant_registry}
  REGISTRY_DB_USER: ${REGISTRY_DB_USER:-registry_app_role}
  REGISTRY_DB_PASSWORD: ${REGISTRY_DB_PASSWORD}
  REGISTRY_DB_HOST: host.docker.internal
  REGISTRY_DB_PORT: "5432"

  PG_SUPERUSER_HOST: host.docker.internal
  PG_SUPERUSER_PORT: "5432"
  PG_SUPERUSER_NAME: ${PG_SUPERUSER_NAME:-postgres}
  PG_SUPERUSER_PASSWORD: ${PG_SUPERUSER_PASSWORD}

  # Redis is containerized (service name 'redis' on the compose network)
  REDIS_URL: redis://redis:6379/0

  CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
  JWT_VERIFYING_KEY: ${JWT_VERIFYING_KEY}

  PLATFORM_BASE_DOMAIN: ${PLATFORM_BASE_DOMAIN:-localhost}

  # Fineract container, published on the host at 8443.
  FINERACT_BASE_URL: ${FINERACT_BASE_URL:-https://host.docker.internal:8443/fineract-provider/api/v1}
  FINERACT_ADMIN_USERNAME: ${FINERACT_ADMIN_USERNAME:-mifos}
  FINERACT_ADMIN_PASSWORD: ${FINERACT_ADMIN_PASSWORD}
  FINERACT_VERIFY_SSL: "false"

# Apply custom static subnet across all services
x-networks: &default-network
  networks:
    - banking-net

services:
  redis:
    image: redis:7-alpine
    container_name: banking-redis
    <<: *default-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-check:
    image: postgres:16-alpine
    container_name: banking-postgres-check
    <<: *default-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c '
        echo "Waiting for host PostgreSQL..." ;
        until pg_isready -h host.docker.internal -p 5432 -U ${PG_SUPERUSER_NAME:-postgres} -t 3; do sleep 2; done ;
        echo "Host PostgreSQL is reachable."
      '

  fineract:
    image: apache/fineract:latest
    container_name: banking-fineract
    <<: *default-network
    ports:
      - "8443:8443"
    env_file:
      - fineract/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-check:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: banking-django-web
    <<: *default-network
    ports:
      - "8000:8000"
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-check:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: banking-angular-webapp
    <<: *default-network
    ports:
      - "4200:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: banking-celery-worker
    <<: *default-network
    command: celery -A tenant_manager worker --loglevel=INFO --concurrency=4
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: banking-celery-beat
    <<: *default-network
    command: celery -A tenant_manager beat --loglevel=INFO
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

networks:
  banking-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1

volumes:
  redis-data: